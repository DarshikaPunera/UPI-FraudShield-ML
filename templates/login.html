{% extends "base.html" %}

{% block title %}Login | SecurePay{% endblock %}

{% block styles %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
{% endblock %}

{% block content %}
<section class="auth-page">
    <div class="auth-card">
        <div class="auth-header">
            <p class="eyebrow">SECUREPAY</p>
            <h1>Welcome Back</h1>
            <p>Sign in to access your SecurePay account.</p>
        </div>

        <form method="POST" action="{{ url_for('login_page') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

            <div class="form-group">
                <label for="login_type">Login As</label>
                <select id="login_type" name="login_type" required>
                    <option value="user">User</option>
                    <option value="admin">Administrator</option>
                </select>
            </div>

            <div class="form-group">
                <label for="username">Username or Email</label>
                <input type="text" id="username" name="username"
                       autocomplete="username" required
                       placeholder="Enter username or email">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="password-wrapper">
                    <input type="password" id="password" name="password"
                           autocomplete="current-password" required
                           placeholder="Enter your password">
                    <button type="button" class="password-toggle"
                            data-toggle-password="password"
                            aria-label="Show password">Show</button>
                </div>
            </div>

            <button type="submit" class="auth-button">Sign In</button>
        </form>

        <p class="auth-footer">
            Don't have an account?
            <a href="{{ url_for('register_page') }}">Create an account</a>
        </p>
    </div>
</section>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/auth.js') }}"></script>
{% endblock %}
